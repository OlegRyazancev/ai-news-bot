services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-news-bot-db
    environment:
      POSTGRES_USER: ${DB_USER:-botuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-botpass}
      POSTGRES_DB: ${DB_NAME:-ai_news_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-botuser} -d ${DB_NAME:-ai_news_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-news-bot
    environment:
      NODE_ENV: production
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql://${DB_USER:-botuser}:${DB_PASSWORD:-botpass}@postgres:5432/${DB_NAME:-ai_news_bot}?schema=public
      NEWS_COLLECTION_CRON: "${NEWS_COLLECTION_CRON:-*/30 * * * *}"
      NEWS_COLLECTION_RUN_ON_STARTUP: "${NEWS_COLLECTION_RUN_ON_STARTUP:-true}"
      NEWS_FETCH_TIMEOUT_MS: "${NEWS_FETCH_TIMEOUT_MS:-15000}"
      NEWS_MAX_ITEMS_PER_SOURCE: "${NEWS_MAX_ITEMS_PER_SOURCE:-50}"
      LLM_PROCESSING_ENABLED: "${LLM_PROCESSING_ENABLED:-false}"
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
      LLM_MODEL: "${LLM_MODEL:-gemini-3.5-flash-lite}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      LLM_PROCESSING_CRON: "${LLM_PROCESSING_CRON:-*/2 * * * *}"
      LLM_PROCESSING_RUN_ON_STARTUP: "${LLM_PROCESSING_RUN_ON_STARTUP:-true}"
      LLM_PROCESSING_BATCH_SIZE: "${LLM_PROCESSING_BATCH_SIZE:-5}"
      LLM_DAILY_REQUEST_LIMIT: "${LLM_DAILY_REQUEST_LIMIT:-20}"
      LLM_REQUEST_TIMEOUT_MS: "${LLM_REQUEST_TIMEOUT_MS:-30000}"
      LLM_MAX_ATTEMPTS: "${LLM_MAX_ATTEMPTS:-3}"
      LLM_RETRY_BASE_DELAY_MS: "${LLM_RETRY_BASE_DELAY_MS:-60000}"
      LLM_RETRY_MAX_DELAY_MS: "${LLM_RETRY_MAX_DELAY_MS:-21600000}"
      LLM_STALE_PROCESSING_MS: "${LLM_STALE_PROCESSING_MS:-600000}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
