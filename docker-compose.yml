version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-news-bot-db
    environment:
      POSTGRES_USER: ${DB_USER:-botuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-botpass}
      POSTGRES_DB: ${DB_NAME:-ai_news_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-botuser} -d ${DB_NAME:-ai_news_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-news-bot
    environment:
      NODE_ENV: production
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql://${DB_USER:-botuser}:${DB_PASSWORD:-botpass}@postgres:5432/${DB_NAME:-ai_news_bot}?schema=public
      NEWS_COLLECTION_CRON: "${NEWS_COLLECTION_CRON:-*/30 * * * *}"
      NEWS_COLLECTION_RUN_ON_STARTUP: "${NEWS_COLLECTION_RUN_ON_STARTUP:-true}"
      NEWS_FETCH_TIMEOUT_MS: "${NEWS_FETCH_TIMEOUT_MS:-15000}"
      NEWS_MAX_ITEMS_PER_SOURCE: "${NEWS_MAX_ITEMS_PER_SOURCE:-50}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
